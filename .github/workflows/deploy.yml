# Produktiv-Deploy nach Azure — Push-Button, vollständig Azure-nativ.
#
# Baut beide Images SERVER-SEITIG in der ACR (az acr build — kein lokaler Docker)
# und stellt die beiden Container Apps auf den neuen Tag um (image-only, KEIN
# Infra-Redeploy). Infra-Änderungen (RG/MI/Front-Door/Cosmos-Container) bleiben
# `_deploy-azure.sh` bzw. dem Bicep-Sub-Deploy vorbehalten — sie gehören nicht in
# den Routine-Image-Push (Front-Door/DNS-Risiko).
#
# Auth: OIDC (Federated Credential) auf die Entra-App `github-deploy-aegira-planner`.
# Repo-Secrets: AZURE_CLIENT_ID · AZURE_TENANT_ID · AZURE_SUBSCRIPTION_ID.
# Rollen des Deploy-SP: Contributor auf ACR (Build/Push) + RG aegira-planner-prod.

name: Deploy (prod)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Container-Image-Tag (z. B. v0.3.2)"
        required: true
        default: "v0.3.2"
      api_base_url:
        description: "NEXT_PUBLIC_API_BASE_URL — wird ins Frontend gebacken! (API-Subdomain)"
        required: true
        default: "https://api.zgpm.aegira.ai"
      lock_idle_sec:
        description: "Lockscreen-Idle in Sekunden — wird ins Frontend gebacken (NEXT_PUBLIC, Build-Zeit). 0 = aus."
        required: false
        default: "900"

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  RG_PLANNER: aegira-planner-prod
  ACR: aegiraacrprodtgygvmrc            # echter Registry-Name (loginServer: aegiraacrprodtgygvmrc.azurecr.io)
  APP_API: ca-aegira-planner-api
  APP_FRONTEND: ca-aegira-planner-frontend

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Server-seitiger Build in der ACR — kein lokaler Docker-Daemon nötig.
      - name: Build & push API image (ACR)
        run: |
          az acr build --registry "$ACR" \
            --image "planner-api:${{ inputs.image_tag }}" \
            --file planner/api/Dockerfile planner/api

      # KRITISCH: NEXT_PUBLIC_API_BASE_URL wird zur Build-Zeit eingebacken → muss
      # die echte API-URL sein (sonst ruft der Browser localhost:8000).
      - name: Build & push Frontend image (ACR)
        run: |
          az acr build --registry "$ACR" \
            --image "planner-frontend:${{ inputs.image_tag }}" \
            --build-arg NEXT_PUBLIC_API_BASE_URL="${{ inputs.api_base_url }}" \
            --build-arg NEXT_PUBLIC_LOCK_IDLE_SEC="${{ inputs.lock_idle_sec }}" \
            --file planner/Dockerfile planner

      - name: Container Apps auf neuen Tag umstellen (image-only)
        run: |
          az containerapp update -g "$RG_PLANNER" -n "$APP_API" \
            --image "$ACR.azurecr.io/planner-api:${{ inputs.image_tag }}"
          az containerapp update -g "$RG_PLANNER" -n "$APP_FRONTEND" \
            --image "$ACR.azurecr.io/planner-frontend:${{ inputs.image_tag }}"

      - name: Smoke-Test (wartet auf Hochlauf)
        run: |
          app=$(curl -sS -o /dev/null -w "%{http_code}" --retry 30 --retry-delay 5 \
            --retry-all-errors --max-time 20 https://zgpm.aegira.ai/ || true)
          api=$(curl -sS -o /dev/null -w "%{http_code}" --retry 30 --retry-delay 5 \
            --retry-all-errors --max-time 20 https://api.zgpm.aegira.ai/health || true)
          echo "app https://zgpm.aegira.ai/ -> $app"
          echo "api https://api.zgpm.aegira.ai/health -> $api"
          test "$app" = "200" -a "$api" = "200" || {
            echo "::error::Smoke-Test fehlgeschlagen (app=$app api=$api)"; exit 1; }
