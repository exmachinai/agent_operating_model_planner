# Produktiv-Deploy nach Azure (Container Apps + Front Door) — manuell ausgelöst.
#
# Voraussetzung (einmalig, durch Owner): Entra-App mit Federated Credential (OIDC)
# auf dieses Repo + Repo-Secrets:
#   AZURE_CLIENT_ID · AZURE_TENANT_ID · AZURE_SUBSCRIPTION_ID
#   USER_MI_ID · ENTRA_APP_ID            (aus dem ersten _deploy-azure.sh-Run)
# Erst-Provisionierung (RG/MI/Entra-App/Front-Door-DNS) bleibt _deploy-azure.sh
# vorbehalten — dieser Workflow deployt Infra-Updates + neue Images push-button.
#
# Details + Diagnose: _meta/HANDOVER_AZURE_DEPLOY_20260530.md

name: Deploy (prod)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Container-Image-Tag"
        required: true
        default: "v0.3.0"
      api_base_url:
        description: "NEXT_PUBLIC_API_BASE_URL (wird ins Frontend gebacken!)"
        required: true
        default: "https://zgpm.aegira.ai"

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  PRIMARY_LOCATION: germanywestcentral
  RG_PLANNER: aegira-planner-prod
  ACR: acraegira

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production   # Schützt mit Required-Reviewers (in Repo-Settings setzen)
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Server-seitiger Build in ACR — kein lokaler Docker-Daemon nötig.
      - name: Build & push API image (ACR)
        run: |
          az acr build --registry "$ACR" \
            --image "planner-api:${{ inputs.image_tag }}" \
            --file planner/api/Dockerfile planner/api

      - name: Build & push Frontend image (ACR)
        run: |
          az acr build --registry "$ACR" \
            --image "planner-frontend:${{ inputs.image_tag }}" \
            --build-arg NEXT_PUBLIC_API_BASE_URL="${{ inputs.api_base_url }}" \
            --file planner/Dockerfile planner

      - name: Bicep deploy (sub scope)
        env:
          BACKEND_API_IMAGE: ${{ env.ACR }}.azurecr.io/planner-api:${{ inputs.image_tag }}
          FRONTEND_IMAGE: ${{ env.ACR }}.azurecr.io/planner-frontend:${{ inputs.image_tag }}
          USER_MI_ID: ${{ secrets.USER_MI_ID }}
          ENTRA_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ENTRA_APP_ID: ${{ secrets.ENTRA_APP_ID }}
        run: |
          az deployment sub create \
            --name "deploy-$(date +%Y%m%d-%H%M%S)" \
            --location "$PRIMARY_LOCATION" \
            --template-file planner/infra/main.bicep \
            --parameters planner/infra/parameters/prod.bicepparam

      - name: Update Container Apps auf neue Image-Tags
        run: |
          az containerapp update -g "$RG_PLANNER" -n planner-api \
            --image "$ACR.azurecr.io/planner-api:${{ inputs.image_tag }}"
          az containerapp update -g "$RG_PLANNER" -n planner-frontend \
            --image "$ACR.azurecr.io/planner-frontend:${{ inputs.image_tag }}"

      - name: Smoke-Test
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" https://zgpm.aegira.ai/ || true)
          echo "zgpm.aegira.ai -> $code"
          test "$code" = "200" || echo "::warning::Front-Door/DNS evtl. noch nicht propagiert — siehe Handover §4."
