# Produktiv-Deploy nach Azure — Push-Button, vollständig Azure-nativ.
#
# Baut beide Images SERVER-SEITIG in der ACR (az acr build — kein lokaler Docker)
# und stellt die beiden Container Apps auf den neuen Tag um (image-only, KEIN
# Infra-Redeploy). Infra-Änderungen (RG/MI/Front-Door/Cosmos-Container) bleiben
# `_deploy-azure.sh` bzw. dem Bicep-Sub-Deploy vorbehalten — sie gehören nicht in
# den Routine-Image-Push (Front-Door/DNS-Risiko).
#
# Auth: OIDC (Federated Credential) auf die Entra-App `github-deploy-aegira-planner`.
# Repo-Secrets: AZURE_CLIENT_ID · AZURE_TENANT_ID · AZURE_SUBSCRIPTION_ID.
# Rollen des Deploy-SP: Contributor auf ACR (Build/Push) + RG aegira-planner-prod.

name: Deploy (prod)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optionaler Image-Tag-Präfix (leer lassen = automatisch aus planner/package.json version). Pro Lauf wird intern '-<run_number>' angehängt, damit immer eine neue Revision rollt (IMMUTABLE)."
        required: false
        default: ""
      api_base_url:
        description: "NEXT_PUBLIC_API_BASE_URL — wird ins Frontend gebacken! (API-Subdomain)"
        required: true
        default: "https://api.zgpm.aegira.ai"
      lock_idle_sec:
        description: "Lockscreen-Idle in Sekunden — wird ins Frontend gebacken (NEXT_PUBLIC, Build-Zeit). 0 = aus."
        required: false
        default: "900"

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  RG_PLANNER: aegira-planner-prod
  ACR: aegiraacrprodtgygvmrc            # echter Registry-Name (loginServer: aegiraacrprodtgygvmrc.azurecr.io)
  APP_API: ca-aegira-planner-api
  APP_FRONTEND: ca-aegira-planner-frontend

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Deterministisch den auslösenden Commit auschecken (nicht den HEAD eines
      # später bewegten Branches). Sauberer, leerer Runner-Workspace → der
      # Build-Kontext ist exakt die main-Quelle dieses Commits.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          clean: true

      # MUTABLE-TAG-FALLE: Wird derselbe Tag (z. B. v0.9.0) erneut deployt, rollt
      # Container Apps KEINE neue Revision — die App läuft mit dem alten Image
      # weiter, obwohl die ACR ein neues Image gebaut hat. Lösung: pro Lauf einen
      # garantiert eindeutigen Tag erzeugen (sprechendes Präfix + run_number),
      # der sowohl beim acr-build als auch beim containerapp-update verwendet wird.
      - name: Eindeutigen Image-Tag bestimmen
        run: |
          # Wenn image_tag-Input gesetzt, diesen verwenden; sonst Version aus package.json lesen.
          # Form: <version>-<run_number> — IMMUTABLE pro Lauf (A-CH3-2/B5).
          INPUT_TAG="${{ inputs.image_tag }}"
          if [ -n "$INPUT_TAG" ]; then
            VERSION_PREFIX="$INPUT_TAG"
          else
            VERSION_PREFIX="$(jq -r '.version' planner/package.json)"
          fi
          echo "IMAGE_TAG=${VERSION_PREFIX}-${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "Effektiver Image-Tag: ${VERSION_PREFIX}-${{ github.run_number }}"
          # Provenance (Cycle-3, A-CH3-NEW1): BUILD_DATE fuer Dockerfile-LABEL + /health durchreichen.
          # GIT_SHA = ${{ github.sha }} (direkt verfuegbar). Selbst-attestierte Code-/Image-Identitaet,
          # KEINE verifizierte/garantierte Angabe; deckt NICHT die LLM-Pfad-Residenz (A2 offen).
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Server-seitiger Build in der ACR — kein lokaler Docker-Daemon nötig.
      - name: Build & push API image (ACR)
        run: |
          az acr build --registry "$ACR" \
            --image "planner-api:$IMAGE_TAG" \
            --build-arg GIT_SHA="${{ github.sha }}" \
            --build-arg BUILD_DATE="$BUILD_DATE" \
            --file planner/api/Dockerfile planner/api

      # KRITISCH: NEXT_PUBLIC_API_BASE_URL wird zur Build-Zeit eingebacken → muss
      # die echte API-URL sein (sonst ruft der Browser localhost:8000).
      # CACHE-FALLE: `az acr build` kennt KEIN --no-cache; der ACR-Task-Layer-Cache
      # kann einen vor-Änderungs-Stand der `COPY . .`/`npm run build`-Layer
      # wiederverwenden (beobachtet v0.9.4-22/-23/-24: „Compiled successfully", aber
      # altes Bundle). Gegenmittel: APP_VERSION = eindeutiger Tag pro Deploy als
      # --build-arg. Im Dockerfile steht das zugehörige ARG VOR `COPY . .` → jeder
      # Deploy invalidiert COPY+Build zwingend und baut frisch gegen den Kontext.
      # Derselbe Tag wird als NEXT_PUBLIC_APP_VERSION in die Client-Chunks gebacken
      # und nach dem Deploy am ausgelieferten Inhalt verifiziert (Schritt unten).
      - name: Build & push Frontend image (ACR)
        run: |
          az acr build --registry "$ACR" \
            --image "planner-frontend:$IMAGE_TAG" \
            --build-arg NEXT_PUBLIC_API_BASE_URL="${{ inputs.api_base_url }}" \
            --build-arg NEXT_PUBLIC_LOCK_IDLE_SEC="${{ inputs.lock_idle_sec }}" \
            --build-arg APP_VERSION="$IMAGE_TAG" \
            --file planner/Dockerfile planner

      # APP_VERSION wird auf den effektiven Tag gesetzt, damit /health beweisbar
      # die NEUE Revision meldet (statt des hartkodierten Config-Defaults). Der
      # eindeutige Tag erzwingt zusammen mit --set-env-vars garantiert eine neue
      # Revision für beide Apps.
      - name: Container Apps auf neuen Tag umstellen (image-only)
        run: |
          az containerapp update -g "$RG_PLANNER" -n "$APP_API" \
            --image "$ACR.azurecr.io/planner-api:$IMAGE_TAG" \
            --set-env-vars "APP_VERSION=$IMAGE_TAG" "GIT_SHA=${{ github.sha }}" "BUILD_DATE=$BUILD_DATE"
          az containerapp update -g "$RG_PLANNER" -n "$APP_FRONTEND" \
            --image "$ACR.azurecr.io/planner-frontend:$IMAGE_TAG"

      - name: Smoke-Test + Versions-Assertion (wartet auf Hochlauf)
        run: |
          app=$(curl -sS -o /dev/null -w "%{http_code}" --retry 30 --retry-delay 5 \
            --retry-all-errors --max-time 20 https://zgpm.aegira.ai/ || true)
          api=$(curl -sS -o /dev/null -w "%{http_code}" --retry 30 --retry-delay 5 \
            --retry-all-errors --max-time 20 https://api.zgpm.aegira.ai/health || true)
          echo "app https://zgpm.aegira.ai/ -> $app"
          echo "api https://api.zgpm.aegira.ai/health -> $api"
          test "$app" = "200" -a "$api" = "200" || {
            echo "::error::Smoke-Test fehlgeschlagen (app=$app api=$api)"; exit 1; }
          # Beweist, dass die NEUE Revision live ist (nicht der alte Container):
          # /health.version muss dem effektiven Image-Tag entsprechen. Mehrfach
          # pollen, bis die neue Revision den Traffic übernimmt.
          live=""
          for i in $(seq 1 30); do
            live=$(curl -sS --max-time 20 https://api.zgpm.aegira.ai/health | jq -r '.version' || true)
            echo "health.version -> $live (erwartet $IMAGE_TAG)"
            [ "$live" = "$IMAGE_TAG" ] && break
            sleep 5
          done
          test "$live" = "$IMAGE_TAG" || {
            echo "::error::Health meldet '$live', erwartet '$IMAGE_TAG' — läuft noch der alte Container?"; exit 1; }
          echo "::notice::Neue Revision live — /health.version = $IMAGE_TAG"

      # FRONTEND-INHALTS-VERIFIKATION — schließt die Lücke, die v0.9.4-22/-23/-24
      # durchrutschen ließ: Der API-Smoke-Test oben prüft NUR die API. Ein veralteter
      # Frontend-Build bestand ihn trotzdem. Hier wird der TATSÄCHLICH AUSGELIEFERTE
      # Frontend-Inhalt geprüft:
      #   - Direkte *.azurecontainerapps.io-FQDN → umgeht Front Door/CDN vollständig
      #     (Next.js-Chunk-Dateinamen sind hier route-stabil, nicht inhalts-gehasht;
      #     Staleness ist NUR per Inhalts-Grep feststellbar, nicht per Dateiname).
      #   - ?cb=$IMAGE_TAG erzwingt einen frischen Pfad.
      #   - /health.version (maschinenlesbar) UND der gebackene Marker $IMAGE_TAG im
      #     ausgelieferten Dokument (data-aomp-version) müssen BEIDE matchen.
      - name: Frontend-Build-Marker verifizieren (direkte FQDN, Front Door umgangen)
        run: |
          fqdn=$(az containerapp show -g "$RG_PLANNER" -n "$APP_FRONTEND" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          test -n "$fqdn" || { echo "::error::Frontend-FQDN nicht ermittelbar"; exit 1; }
          echo "Direkte Frontend-FQDN: $fqdn — erwarteter Marker: $IMAGE_TAG"
          hv=""; doc_ok=""
          for i in $(seq 1 40); do
            hv=$(curl -sS --max-time 20 "https://$fqdn/health?cb=$IMAGE_TAG" | jq -r '.version' 2>/dev/null || true)
            body=$(curl -sS --max-time 20 "https://$fqdn/?cb=$IMAGE_TAG" || true)
            doc_ok=$(printf '%s' "$body" | grep -qF "$IMAGE_TAG" && echo yes || echo no)
            echo "Versuch $i: /health.version=$hv · Marker im Dokument=$doc_ok"
            [ "$hv" = "$IMAGE_TAG" ] && [ "$doc_ok" = "yes" ] && break
            sleep 5
          done
          test "$hv" = "$IMAGE_TAG" -a "$doc_ok" = "yes" || {
            echo "::error::Frontend liefert NICHT den erwarteten Build-Marker '$IMAGE_TAG' (health.version='$hv', Marker im Dokument=$doc_ok) — veralteter Build/Cache."; exit 1; }
          echo "::notice::Frontend-Inhalt verifiziert — Marker '$IMAGE_TAG' im ausgelieferten Dokument live."
