# Mutation-Testing-Konfiguration (Teststrategie §4, P2).
# Ziel: Mutation-Score >= 75 % für den deterministischen Compiler-Kern.
#
# Lauf (CI-Budget — je Mutant ein pytest-Lauf, daher nicht interaktiv):
#   cd planner/api && mutmut run
#   mutmut results            # Übersicht
#   mutmut show <mutant>      # überlebenden Mutanten ansehen
#
# Hinweis: mutmut 3.x entdeckt die Tests selbst; vor dem Lauf muss die Suite grün
# sein (aktuell 117 passed). Scope bewusst auf den Compiler-Kern begrenzt.
[mutmut]
paths_to_mutate=app/harness/compiler.py
