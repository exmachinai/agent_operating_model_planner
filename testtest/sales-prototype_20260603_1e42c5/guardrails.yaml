policy: "Layered Defense, optimistische Ausführung. High-Risk-Tools (Schreiben/irreversibel/Finanz/PII) pausieren für HITL-Freigabe."
guardrails:
- id: "relevance"
  label: "Relevanz-Classifier"
  kind: "llm"
  desc: "Flaggt off-topic Anfragen außerhalb des Projektscopes."
- id: "safety"
  label: "Safety-/Jailbreak-Classifier"
  kind: "llm"
  desc: "Erkennt Prompt-Injection/Jailbreak-Versuche."
- id: "pii"
  label: "PII-Filter"
  kind: "rule+llm"
  desc: "Verhindert unnötige Preisgabe personenbezogener Daten."
- id: "moderation"
  label: "Moderation"
  kind: "llm"
  desc: "Flaggt schädliche/unangemessene Inhalte."
- id: "tool-risk"
  label: "Tool-Risk-Safeguard"
  kind: "policy"
  desc: "High-Risk-Tools (Schreiben/irreversibel/Finanz) pausieren für HITL."
- id: "output-validation"
  label: "Output-Validation"
  kind: "rule+llm"
  desc: "Markenkonforme, schema-valide Ausgaben (keine 100%-Claims)."
